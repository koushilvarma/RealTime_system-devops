apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cicd-app

  template:
    metadata:
      labels:
        app: cicd-app

    spec:
      containers:
      - name: cicd-app
        image: koushilvarma/cicd-app:latest
        ports:
        - containerPort: 3000